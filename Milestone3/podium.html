<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset = 'utf-8'>

        <title>COM-480: Milestone 3 - Podium</title>

        <link rel='stylesheet' href='styles.css'>

    </head>

    <body>
        <main>
            <h1 id="disciplineName"></h1>
            <img id="disciplineImage" src="" alt="Discipline Image">

            <!-- events table -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Event Name</th>
                            <th>Venue</th>
                            <th>Schedule</th>
                        </tr>
                    </thead>
                    <tbody>
                    <!-- TEST DATA -->
                        <tr>
                            <td>Men's Single</td>
                            <td>Milano Arena</td>
                            <td>Feb 15, 2026</td>
                        </tr>
                        <tr>
                            <td>Women's Single</td>
                            <td>Cortina Stadium</td>
                            <td>Feb 16, 2026</td>
                        </tr>
                        <tr>
                            <td>Mixed Doubles</td>
                            <td>Milano Arena</td>
                            <td>Feb 18, 2026</td>
                        </tr>
                        <tr>
                            <td>Team Event</td>
                            <td>Cortina Stadium</td>
                            <td>Feb 20, 2026</td>
                        </tr>
                        <tr>
                            <td>Final Championship</td>
                            <td>Milano Arena</td>
                            <td>Feb 22, 2026</td>
                        </tr>
                    </tbody>
                </table>
            </div>


            <h3 id="disciplineDetails"></h3>
            <p id="disciplineURL"></p>
        </main>

        <script>
            // Get URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const disciplineName = urlParams.get('discipline');  
            const disciplineURL = urlParams.get('url');  
            const disciplineImage = urlParams.get('image');
            
            // Use variables for HTML
            document.getElementById('disciplineName').textContent = disciplineName;
            document.getElementById('disciplineDetails').textContent = `More details about ${disciplineName}`;
            document.getElementById('disciplineURL').innerHTML = `<a href="${disciplineURL}" target="_blank">View official Olympics Website for ${disciplineName}</a>`;
            document.getElementById('disciplineImage').src = disciplineImage;
        </script>
    </body>
</html>
